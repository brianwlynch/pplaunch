<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Settings</title>
  <link rel="stylesheet" href="./gameSettings.css">
  <script src="./gameSettings.js" defer></script>
</head>

<body>
  <div class="container">
    <h2>Reset High Scores</h2>

    <div>
      This will reset the high scores for the local leaderboard!
      <!-- <b><u>and</u></b> will remove them from the global leaderboard. -->
    </div>
    
    <button id="resetButton" onclick="resetScores()">
      <img src="../assets/images/alert.svg" id="alertIcon"><br>
      <label for="alertIcon" style="color: black;">RESET HIGH SCORES</label>
    </button><br>


    <div id="resetHover">
      Scores will be reset and this window will close!
    </div><br>
  </div>


</body>

</html>
