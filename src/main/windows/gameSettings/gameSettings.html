<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Settings</title>
  <link rel="stylesheet" href="./gameSettings.css">
  <script src="./gameSettings.js" defer></script>
</head>

<body>
  <div class="container">
    <h2>Game Settings</h2>

    <div class="panelLocation" id="panelLocationDiv" style="margin: 8px;">
      <table id="table" style="margin: 0 auto;">
        <tr>
          <td>
            <label for="unitName"><b><u>Unit Name:</u></b></label><br>
            <input type="text" id="unit" placeholder="UNIT" style="width: 148px;
              height: 48px;
              text-align: center;
              padding: 0;
              margin: 5px;
              " />
          </td>
          <td>
            <label for="panelLocation"><b><u>Panel Location:</u></b></label><br>
            <select name="panelLocation" id="panelLocation" style="width: 150px;
              height: 50px;
              line-height: 50px;
              text-align: center;
              margin: 5px;"">
              <option value="audio">Audio</option>
              <option value="engineering">Engineering</option>
              <option value="flex">Flex Room</option>
              <option value="production">Production</option>
              <option value="replay">Replay</option>
              <option value="submix">Submix</option>
              <option value="td">TD</option>
              <option value="video">Video</option>
              <option value="non">Non-Specific (Tablet)</option>
              <option value="custom">Custom</option>
            </select>
          </td>
          <td id="customLocationCell" style="display: none;">
            <label for="customLocation"><b><u>Custom Location:</u></b></label><br>
            <input type="text" id="customLocation" placeholder="Custom" style="width: 148px;
              height: 48px;
              text-align: center;
              padding: 0;
              margin: 5px;
              " />
          </td>
        </tr>
      </table>
      <label><i>Please be specific! Ex. SS7 / SSCBS-B / ND2-D</i></label><br>
      
      <button id="locationSubmit" onclick="saveGameSettings()">
        Save Location
      </button>
    </div>

    <hr>

    <div>
      This will reset the high scores for the local leaderboard!
      <!-- <b><u>and</u></b> will remove them from the global leaderboard. -->
    </div>
    
    <button id="resetButton" onclick="resetScores()">
      <img src="../assets/images/alert.svg" id="alertIcon"><br>
      <label for="alertIcon" style="color: black;">RESET HIGH SCORES</label>
    </button><br>


    <div id="resetHover">
      Scores will be reset and this window will close!
    </div><br>
  </div>


</body>

</html>
